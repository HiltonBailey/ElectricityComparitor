type: sections
title: Energy Retailer Charts
path: energy-retailer-charts
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: heading
        heading: Energy Retailer Charts
      - type: custom:apexcharts-card
        header:
          title: Daily Cost Comparison
          show: true
        graph_span: 14d
        series:
          - entity: sensor.retailer_daily_summary
            name: FlowPower
            type: column
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d['FlowPower'] || 0]);
          - entity: sensor.retailer_daily_summary
            name: Origin
            type: column
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d['Origin Loop Max'] || 0]);
          - entity: sensor.retailer_daily_summary
            name: Globird
            type: column
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d['Globird VPP'] || 0]);
          - entity: sensor.retailer_daily_summary
            name: CovaU
            type: column
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d['CovaU SolarMax'] || 0]);
          - entity: sensor.retailer_daily_summary
            name: Amber
            type: column
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d['Amber'] || 0]);
        apex_config:
          chart:
            animations:
              enabled: false
          plotOptions:
            bar:
              columnWidth: 50%
          dataLabels:
            enabled: false
          yaxis:
            title:
              text: Net Cost ($)
      - type: custom:apexcharts-card
        header:
          title: Billing Month Cumulative
          show: true
        graph_span: 31d
        series:
          - entity: sensor.retailer_daily_summary
            name: FlowPower
            type: line
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d['FlowPower_cum'] || 0]);
          - entity: sensor.retailer_daily_summary
            name: Origin
            type: line
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d['Origin Loop Max_cum'] || 0]);
          - entity: sensor.retailer_daily_summary
            name: Globird
            type: line
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d['Globird VPP_cum'] || 0]);
          - entity: sensor.retailer_daily_summary
            name: CovaU
            type: line
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d['CovaU SolarMax_cum'] || 0]);
          - entity: sensor.retailer_daily_summary
            name: Amber
            type: line
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d['Amber_cum'] || 0]);
        apex_config:
          chart:
            animations:
              enabled: false
          stroke:
            width: 2
          yaxis:
            title:
              text: Cumulative Net Cost ($)
      - type: custom:apexcharts-card
        header:
          title: Daily Import / Export kWh
          show: true
        stacked: true
        graph_span: 14d
        series:
          - entity: sensor.retailer_daily_summary
            name: Import
            type: column
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d.import_kwh || 0]);
          - entity: sensor.retailer_daily_summary
            name: Export
            type: column
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              return data.map(d => [new Date(d.date + 'T00:00:00').getTime(), d.export_kwh || 0]);
        apex_config:
          chart:
            animations:
              enabled: false
          plotOptions:
            bar:
              columnWidth: 50%
          dataLabels:
            enabled: false
          yaxis:
            title:
              text: kWh
      - type: custom:apexcharts-card
        header:
          title: 5-Min Import Profile
          show: true
        graph_span: 1d
        span:
          start: day
        series:
          - entity: sensor.retailer_five_min_detail
            name: FlowPower
            type: area
            data_generator: |
              const raw = entity.attributes.chart_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || {});
              const key = Object.keys(data).find(k => k.startsWith('FlowPower_'));
              if (!key) return [];
              const dateStr = key.split('_').slice(1).join('_');
              return (data[key] || []).map(i => [new Date(dateStr + 'T' + i.t).getTime(), (i.ik || 0) * 12]);
        apex_config:
          chart:
            animations:
              enabled: false
          stroke:
            width: 1
          yaxis:
            title:
              text: kW
      - type: custom:apexcharts-card
        header:
          title: AEMO Wholesale Price
          show: true
        graph_span: 1d
        span:
          start: day
        series:
          - entity: sensor.retailer_five_min_detail
            name: AEMO Price
            type: area
            data_generator: |
              const raw = entity.attributes.chart_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || {});
              const key = Object.keys(data).find(k => k.startsWith('FlowPower_'));
              if (!key) return [];
              const dateStr = key.split('_').slice(1).join('_');
              return (data[key] || []).map(i => [new Date(dateStr + 'T' + i.t).getTime(), i.ap || 0]);
        apex_config:
          chart:
            animations:
              enabled: false
          stroke:
            width: 1
          yaxis:
            title:
              text: $/kWh
      - type: custom:apexcharts-card
        header:
          title: All Retailers Monthly Cost
          show: true
        graph_span: 365d
        series:
          - entity: sensor.retailer_daily_summary
            name: FlowPower
            type: line
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              const monthly = {};
              data.forEach(d => {
                const m = d.date.substring(0, 7);
                if (!monthly[m]) monthly[m] = 0;
                monthly[m] += (d['FlowPower'] || 0);
              });
              return Object.keys(monthly).sort().map(m => [new Date(m + '-15T00:00:00').getTime(), Math.round(monthly[m] * 100) / 100]);
          - entity: sensor.retailer_daily_summary
            name: Origin Loop Max
            type: line
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              const monthly = {};
              data.forEach(d => {
                const m = d.date.substring(0, 7);
                if (!monthly[m]) monthly[m] = 0;
                monthly[m] += (d['Origin Loop Max'] || 0);
              });
              return Object.keys(monthly).sort().map(m => [new Date(m + '-15T00:00:00').getTime(), Math.round(monthly[m] * 100) / 100]);
          - entity: sensor.retailer_daily_summary
            name: Globird VPP
            type: line
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              const monthly = {};
              data.forEach(d => {
                const m = d.date.substring(0, 7);
                if (!monthly[m]) monthly[m] = 0;
                monthly[m] += (d['Globird VPP'] || 0);
              });
              return Object.keys(monthly).sort().map(m => [new Date(m + '-15T00:00:00').getTime(), Math.round(monthly[m] * 100) / 100]);
          - entity: sensor.retailer_daily_summary
            name: CovaU SolarMax
            type: line
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              const monthly = {};
              data.forEach(d => {
                const m = d.date.substring(0, 7);
                if (!monthly[m]) monthly[m] = 0;
                monthly[m] += (d['CovaU SolarMax'] || 0);
              });
              return Object.keys(monthly).sort().map(m => [new Date(m + '-15T00:00:00').getTime(), Math.round(monthly[m] * 100) / 100]);
          - entity: sensor.retailer_daily_summary
            name: Amber
            type: line
            data_generator: |
              const raw = entity.attributes.daily_data;
              const data = typeof raw === 'string' ? JSON.parse(raw) : (raw || []);
              const monthly = {};
              data.forEach(d => {
                const m = d.date.substring(0, 7);
                if (!monthly[m]) monthly[m] = 0;
                monthly[m] += (d['Amber'] || 0);
              });
              return Object.keys(monthly).sort().map(m => [new Date(m + '-15T00:00:00').getTime(), Math.round(monthly[m] * 100) / 100]);
        apex_config:
          chart:
            animations:
              enabled: false
          stroke:
            width: 2
          yaxis:
            title:
              text: Monthly Net Cost ($)
          annotations:
            yaxis:
              - y: 0
                strokeDashArray: 0
                borderColor: "#2962FF"
                borderWidth: 2
cards: []

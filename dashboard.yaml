type: sections
title: Energy Retailer Costs
path: testing
max_columns: 4
header:
  layout: responsive
  badges_position: top
  badges_wrap: scroll
sections:
  - type: grid
    column_span: 4
    cards:
      - type: heading
        heading: Monthly Summary
      - type: custom:html-card
        title: Monthly Cost Summary
        content: |
          [[ sensor.retailer_monthly_summary.attributes.html ]]
        grid_options:
          columns: full
      - type: heading
        heading: Daily Energy Breakdown
      - type: custom:html-card
        title: Daily Cost Summary
        content: |
          [[ sensor.retailer_daily_summary.attributes.html ]]
        grid_options:
          columns: full
      - type: custom:html-card
        title: Daily Cost Detail
        content: |
          [[ sensor.retailer_daily_detail.attributes.html ]]
        grid_options:
          columns: full
  - type: grid
    column_span: 4
    cards:
      - type: heading
        heading: 5-Minute Interval Detail
      - type: custom:html-card
        title: 5-Min Detail
        content: |
          <iframe src="http://192.168.50.9:1880/endpoint/api/5min-detail-page" style="width:100%;height:400px;border:none;border-radius:6px"></iframe>
        grid_options:
          columns: full
cards: []
